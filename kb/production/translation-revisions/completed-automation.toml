prompt = "Continue the authorized Kabita Live full-collection Human Natural Translation / Poetic Natural revision work in this same chat and /Users/ahimanikya/Projects/Kabita Live. Ahimanikya approved the five-poem comparison and asked to fix all such findings in batches across the entire collection. Read AGENTS.md, current KB entrypoint and roles, kb/records/translation-revision-loop-2026-10-04.json and kb/production/translation-revisions/WORKFLOW.md. This supersedes the old first-draft-only translation loop; preserve its history and missing-source holds.\n\nResume any incomplete or unverified revision batch first. Refresh tools/translation_revision_queue.py, then work through remaining variants in the current newest unfinished edition, in publication order. Use sequential internal batches of about five poems / ten variants, smaller for difficult or long poems. No overlapping workers or subagents. Read every complete source and each complete current target directly, using the Human Natural Translation skill in Poetic Natural mode. Examine all variants, including those without earlier flags. Preserve accurate existing wording; fix defensible meaning, agency, idiom, cadence, register, repetition, wordplay and lineation problems. Never apply blanket substitutions. Preserve original poems, authored translations, bylines and credits; revise only the existing generated target drafts. Source ambiguities, kinship, gender, dialect and damaged readings require recorded holds rather than invented certainty. Continue independent corrections while holds remain. The historical Odia Kafka agency claim PNR-013 was overstated; retain its recorded qualification.\n\nStore exact before/after variants, reasons, tradeoffs, old/new finding dispositions and current full-reading evidence in the next batch-NNN under kb/production/translation-revisions. Use tools/apply_translation_revision.py; it rejects stale before versions and preserves a catalogue backup. Follow WORKFLOW.md for interrupted writes and explicit reader_layout mappings when target lineation or inherited offsets change. Never reuse original verse-tail offsets blindly. Preserve prior uncertainties outside the poem, label actual self-review honestly, and keep variants draft with independent review pending.\n\nAfter each integrated batch, run the layout regression tests, refresh both translation inventory and revision queue, build with Node 24, run tools/check_editions.py and tools/check_translation_revisions.py, and save exact verification. Inspect the browser when new layout cases warrant it. Update KBL-WORK-023, loop progress and activity, regenerate registers/catalogue, check bundle, sync the portable handoff and check storage. Preserve concurrent work, all reader services, consent, noindex and release gates. Do not push, publish, deploy, contact contributors, use paid APIs or change unrelated content.\n\nContinue actionable work as far as practical each run, saving each completed batch. If interrupted, persist the exact resume point and keep the heartbeat active. Stop repeating unchanged holds. When every actionable variant has been examined and verified, pause this automation with automation_update and report revised/retained counts separately from unresolved source questions and the existing missing targets. Never call held text fixed or screening a full literary review. Notify the user only at meaningful edition milestones, actionable failures or final completion; stay quiet when nothing meaningful changes."
