style.width=width+"px";for(const path of paths){await new Promise(resolve=>{f.onload=async()=>{await f.contentDocument.fonts.ready;const d=f.contentDocument;results.push({path,width,scroll:d.documentElement.scrollWidth,brokenImages:[...d.images].filter(x=>!x.complete||!x.naturalWidth).length});resolve();};f.src=path;});document.getElementById("results").textContent=JSON.stringify(results,null,2);}}document.getElementById("qa").textContent="Complete: "+results.length+" layouts; failures: "+results.filter(x=>x.scroll>x.width||x.brokenImages).length;};</script></body></html>
