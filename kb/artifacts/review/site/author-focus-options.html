 decoding=\"async\"><\/figure><\/section>", "bio": "<article id=\"biography\" class=\"prose editor-biography\"><section><h2>Life and writing.<\/h2><p lang=\"en\">Majrooh Rashid, also known as A. R. Malik, is a poet, critic and translator. He writes in Kashmiri, Urdu and English. His work brings creative writing into conversation with the study and translation of literature.<\/p><p lang=\"en\">He joined the University of Kashmir’s Department of Kashmiri in 1991. His university profile records teaching in literary criticism, modern poetry, Lal Ded and Shaikh-ul-Alam. Kabita Live’s contributor biography records his later retirement as a professor.<\/p><\/section><section><h2>Between languages.<\/h2><p lang=\"en\">His publications include Readings and Asri Kashir Shari, alongside monographs on Asad Mir and Lasa Khan Fida. His English translations have appeared in Sahitya Akademi publications, including Medieval Indian Literature.<\/p><p lang=\"en\">Kabita Live brings together several of his English poems, including Drink, Return of the Bumblebee, A Complaint and Marvel. Each can be read here in its complete form.<\/p><\/section><\/article>", "books": "<details class=\"focus-books\"><summary>Selected books<\/summary><aside class=\"editor-book-shelf\" id=\"selected-books\"><ul><li><a href=\"https://kashmiruniversity.net/Diqa/Resume/majroohrashid.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Readings <svg class=\"external-mark\" viewBox=\"0 0 20 20\" width=\"13\" height=\"13\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M4 16C7 15 9 9 16 4M10 4.5 16 4l-.4 6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.25\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><span class=\"sr-only\"> (external link, opens in a new tab)<\/span><\/a><span>Book Media · 2007<\/span><\/li><li><a href=\"https://kashmiruniversity.net/Diqa/Resume/majroohrashid.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Asri Kashir Shari <svg class=\"external-mark\" viewBox=\" el<\/a><span class=\"contribution-mobile-date\">August 2023<\/span><\/td><td><a class=\"contribution-issue\" href=\"issue-10.html\">Issue 10<\/a><\/td><td>August 2023<\/td><\/tr><\/tbody><\/table><\/section><\/div>"}, "56": {"label": "Long biography", "hero": "<section class=\"editor-profile-opening author-profile-opening\"><div><h1 class=\"en\" lang=\"en\">Debarati Sen<\/h1><p class=\"signature\" lang=\"or\">ମାଟିର ମହକ · ହୃଦୟର ସ୍ବର<\/p><a class=\"focus-jump\" href=\"#contributions\">Read the poems ↓<\/a><\/div><figure class=\"editor-portrait author-portrait journal_photo\"><img src=\"assets/writers/56-journal.webp\" alt=\"Portrait of Debarati Sen\" width=\"600\" height=\"600\" decoding=\"async\"><\/figure><\/section>", "bio": "<article id=\"biography\" class=\"prose editor-biography\"><section><h2>Life and writing.<\/h2><p lang=\"en\">Debarati Sen works in Presidency University Kolkata as a Junior Assistant. Her debut poetry book called `Blurred Musings` was published in January 2022 and was launched by Literoma at the Newtown Book Fair. Recipient of the Tagore Award 2022 and the Sylvia Plath Women`s Literary Award, Debarati finds emancipation in her poetry! She has also been the winner of the International Poetry Writing competition held by the Elite Book Awards in November 2021. She has grabbed the third position in the National Poetry Writing Month 2022 contest hosted by the Elite Book Awards. Debarati features in the Council Year Book launched on the occasion of Women`s Day 2022 by Literoma in association with the Public Safety and Security Council of Bengal. She has also been declared as an Empanelled Author in the International Author`s Conclave held by Literoma in December 2021. She is one among the top ten poets of the Women;`s Day poetry contest organised by Delhi Poetry Slam. She has been recently nominated by Beyond the Box as a finalist for the BTB Wordsmiths Award 2022 as the most eloquent writer and for the category of the Most impactful contribution of the year 2022 (for the poem Time`s Tentacles). She has co-authored more than 15 anthologies and is recently compiling her first anthology as a compiler with the Quill House Publishers. Her poems have found shelter in prestigious websites like The Antonym, The Yugen Quest Review, The Kolkata Arts, Lapis Lazuli, The Das Literarisch, The Sindh Courier, Synchronized Chaos, to name a few.<\/p><\/section><\/article>", "books": "", "table": "<section class=\"writer-work\" id=\"contributions\"><div class=\"section-head\"><h2>A voice across the pages.<\/h2><span class=\"small muted\">1 poem<\/span><\/div><table class=\"contribution-table\"><caption class=\"sr-only\">Poems by Debarati Sen<\/caption><thead><tr><th scope=\"col\">Poem<\/th><th scope=\"col\">Edition<\/th><th scope=\"col\">Published<\/th><\/tr><\/thead><tbody><tr data-contribution=\"Maple Dreams\"><td><a class=\"contribution-title\" lang=\"en\" href=\"poem-56.html\">Maple Dreams<\/a><span class=\"contribution-mobile-date\">December 2022<\/span><\/td><td><a class=\"contribution-issue\" href=\"issue-2.html\">Issue 2<\/a><\/td><td>December 2022<\/td><\/tr><\/tbody><\/table><\/section>", "foot": "<p class=\"profile-footnote\"><a href=\"about.html#credits-writers\">Sources and portrait credit<\/a><\/p><div class=\"next-prev\"><a href=\"poets.html\">← All writers<\/a><a href=\"archive.html\">Explore the editions →<\/a><\/div>", "crumb": "<div class=\"breadcrumb\"><a href=\"index.html\">Home<\/a> / <a href=\"poets.html\">Poets<\/a> / Debarati Sen<\/div>", "approved": "<div class=\"author-clear\"><div class=\"breadcrumb\"><a href=\"index.html\">Home<\/a> / <a href=\"poets.html\">Poets<\/a> / Debarati Sen<\/div><section class=\"editor-profile-opening author-profile-opening\"><div><h1 class=\"en\" lang=\"en\">Debarati Sen<\/h1><figure class=\"author-quote\" data-quote-poem=\"56\"><blockquote lang=\"en\">I will try to sleep again.\nFor my dreams are a safer place.<\/blockquote><figcaption>— <a href=\"poem-56.html\" lang=\"en\"><cite>Maple Dreams<\/cite><\/a><\/figcaption><\/figure><\/div><figure class=\"editor-portrait author-portrait journal_photo\"><img src=\"assets/writers/56-journal.webp\" alt=\"Portrait of Debarati Sen\" width=\"600\" height=\"600\" decoding=\"async\"><\/figure><\/section><div class=\"author-reading-layout author-clear-reading\"><article id=\"biography\" class=\"prose editor-biography\"><section><h2>Life and writing.<\/h2><p lang=\"en\">Debarati Sen works in Presidency University Kolkata as a Junior Assistant. Her debut poetry book called `Blurred Musings` was published in January 2022 and was launched by Literoma at the Newtown Book Fair. Recipient of the Tagore Award 2022 and the Sylvia Plath Women`s Literary Award, Debarati finds emancipation in her poetry! She has also been the winner of the International Poetry Writing competition held by the Elite Book Awards in November 2021. She has grabbed the third position in the National Poetry Writing Month 2022 contest hosted by the Elite Book Awards. Debarati features in the Council Year Book launched on the occasion of Women`s Day 2022 by Literoma in association with the Public Safety and Security Council of Bengal. She has also been declared as an Empanelled Author in the International Author`s Conclave held by Literoma in December 2021. She is one among the top ten poets of the Women;`s Day poetry contest organised by Delhi Poetry Slam. She has been recently nominated by Beyond the Box as a finalist for the BTB Wordsmiths Award 2022 as the most eloquent writer and for the category of the Most impactful contribution of the year 2022 (for the poem Time`s Tentacles). She has co-authored more than 15 anthologies and is recently compiling her first anthology as a compiler with the Quill House Publishers. Her poems have found shelter in prestigious websites like The Antonym, The Yugen Quest Review, The Kolkata Arts, Lapis Lazuli, The Das Literarisch, The Sindh Courier, Synchronized Chaos, to name a few.<\/p><\/section><\/article><\/div><section class=\"writer-work\" id=\"contributions\"><div class=\"section-head\"><h2>A voice in one poem.<\/h2><\/div><table class=\"contribution-table\"><caption class=\"sr-only\">Poems by Debarati Sen<\/caption><thead><tr><th scope=\"col\">Poem<\/th><th scope=\"col\">Edition<\/th><th scope=\"col\">Published<\/th><\/tr><\/thead><tbody><tr data-contribution=\"Maple Dreams\"><td><a class=\"contribution-title\" lang=\"en\" href=\"poem-56.html\">Maple Dreams<\/a><span class=\"contribution-mobile-date\">December 2022<\/span><\/td><td><a class=\"contribution-issue\" href=\"issue-2.html\">Issue 2<\/a><\/td><td>December 2022<\/td><\/tr><\/tbody><\/table><\/section><\/div>"}}</script><script>
