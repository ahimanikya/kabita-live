<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Poem spacing · review</title><style>body{margin:0;background:#e7e0cf;color:#263e40;font:16px system-ui}header{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;padding:12px}button,select,a{font:inherit;color:inherit}button,select{background:#f5f0e2;border:1px solid #9b947e;padding:10px;border-radius:4px;min-height:44px}button[aria-pressed=true]{background:#263e40;color:#f5f0e2}iframe{display:block;margin:auto;border:0;background:#f5f0e2;width:360px;height:calc(100dvh - 85px);max-width:100%}a{padding:12px}</style><header><button data-width="360" aria-pressed="true">Phone</button><button data-width="820" aria-pressed="false">Tablet</button><button data-width="1280" aria-pressed="false">Desktop</button><select aria-label="Poem example"><option value="8">Odia poem</option><option value="772">Long English title</option></select><a id="open" href="poem-space-8.html">Open full page</a></header><iframe title="Poem design mock" src="poem-space-8.html"></iframe><script>const f=document.querySelector('iframe');document.querySelectorAll('button').forEach(b=>b.onclick=()=>{f.style.width=b.dataset.width+'px';document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))});document.querySelector('select').onchange=e=>{f.src='poem-space-'+e.target.value+'.html';document.querySelector('#open').href=f.getAttribute('src')};</script></html>
