<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Poem artwork · Kabita Live</title><link rel="stylesheet" href="assets/style.css"><style>main{padding:40px 0}h1{font-size:48px;margin:28px 0 16px}.art-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:36px}.art-grid figure{margin:0}.art-grid img{width:100%;height:auto}.art-grid figcaption{font:16px/1.6 var(--ui);margin-top:12px;color:var(--muted)}@media(max-width:760px){.art-grid{grid-template-columns:1fr}h1{font-size:36px}}</style></head><body class="journal-paper cotton-paper site-theme"><script src="assets/appearance.js"></script><main class="wrap"><a href="poem-815.html">See a poem page</a><h1>Poems have their own light.</h1><p>The first six dedicated illustrations, preserved as a collection. The expanded library now includes earlier watercolor work and text-based assignments. <a href="image-library-audit.html">Explore the complete image catalogue</a>.</p><div class="art-grid"><figure><img src="assets/poem-art/library/pond-at-dawn.png" width="1536" height="1024" alt="An intimate view of a rural Odisha pond at dawn." loading="lazy"><figcaption>The pond holds the morning quietly.</figcaption></figure><figure><img src="assets/poem-art/library/kendu-light.png" width="1536" height="1024" alt="A small branch of broad oval kendu leaves in an Odisha woodland, a single drop of rain at the edge of a leaf." loading="lazy"><figcaption>In the woodland, light finds a leaf.</figcaption></figure><figure><img src="assets/poem-art/library/thread-by-the-window.png" width="1536" height="1024" alt="An everyday corner in an Odisha home: a folded handwoven Sambalpuri sari with a restrained ivory and indigo geometric ikat border lies on a low wooden stool." loading="lazy"><figcaption>A loose thread remembers the hands.</figcaption></figure><figure><img src="assets/poem-art/library/koraput-morning.png" width="1536" height="1024" alt="A narrow earthen footpath through dewy grass on a misty Koraput hillside in Odisha, soft blue-green ridges receding, a single small wildflower near the path." loading="lazy"><figcaption>The hills leave room for a breath.</figcaption></figure><figure><img src="assets/poem-art/library/courtyard-petals.png" width="1536" height="1024" alt="A sunlit earthen courtyard corner in Odisha after a brief shower, weathered warm laterite wall, a few fallen magenta bougainvillea petals beside a tiny pale puddle." loading="lazy"><figcaption>A few petals. The afternoon stays.</figcaption></figure><figure><img src="assets/poem-art/library/sea-breeze-cloth.png" width="1536" height="1024" alt="A small off-white and muted red checked cotton gamucha hanging loosely on a simple timber rail near Odisha&#x27;s coast." loading="lazy"><figcaption>The breeze carries what words leave behind.</figcaption></figure></div></main></body></html>
