<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Icon study verification</title><style>body{font:16px system-ui}pre{white-space:pre-wrap}iframe{height:900px;border:1px solid #999}</style><h1>Icon study verification</h1><p id="status" role="status">Checking…</p><pre id="results"></pre><iframe title="Study under test"></iframe><script>
(async()=>{const out=[],f=document.querySelector('iframe');try{for(const width of [1280,360])for(const name of ['icon-atelier.html','literary-study.html']){f.style.width=width+'px';await new Promise(r=>{f.onload=r;f.src='../'+name;});const d=f.contentDocument,w=f.contentWindow;await d.fonts.ready;const functional={};if(name==='icon-atelier.html'){const set=(id,v)=>{const el=d.getElementById(id);el.value=v;el.dispatchEvent(new w.Event('input',{bubbles:true}));};set('icon-search','zznonexistent');functional.empty=!d.querySelector('#icon-empty').hidden;set('icon-search','');set('icon-family','utility');functional.utility=d.querySelector('#icon-count').textContent==='12 of 26 symbols';set('icon-family','editorial');set('icon-tone','earth');set('icon-size','36');functional.editorial=d.querySelector('#icon-count').textContent==='14 of 26 symbols';functional.earth=d.querySelector('#icon-grid').classList.contains('earth-treatment');functional.downloads=[...d.querySelectorAll('.svg-download')].every(a=>a.href.includes('/earth/'));set('icon-family','all');}
await new Promise((r,j)=>{const s=d.createElement('script');s.src='audit/axe.min.js';s.onload=r;s.onerror=j;d.head.append(s)});const a=await w.axe.run(d,{runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21aa','wcag22aa']},resultTypes:['violations']});const row={page:name,width,overflow:d.documentElement.scrollWidth>width,brokenImages:[...d.images].filter(i=>i.complete&&!i.naturalWidth).length,violations:a.violations.map(x=>({id:x.id,nodes:x.nodes.map(n=>n.target)})),functional};if(name==='icon-atelier.html'){d.getElementById('icon-night').click();row.darkEnabled=d.getElementById('icon-grid').classList.contains('dark-proof');const b=await w.axe.run(d,{runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21aa','wcag22aa']},resultTypes:['violations']});row.darkViolations=b.violations.map(x=>({id:x.id,nodes:x.nodes.map(n=>n.target)}));}out.push(row);}document.querySelector('#status').textContent='Complete';}catch(e){out.push({error:String(e)});document.querySelector('#status').textContent='Failed';}document.querySelector('#results').textContent=JSON.stringify(out,null,2);})();
</script></html>
