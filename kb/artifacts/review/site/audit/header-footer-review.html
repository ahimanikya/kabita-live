<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kabita Live · Header and footer close review</title><style>
*{box-sizing:border-box}body{margin:0;background:#eae1cd;color:#263c3c;font:16px/1.6 Arial,sans-serif}main{padding:28px;max-width:1460px;margin:auto}h1{font:36px Georgia,serif;margin:0 0 10px}h2{font:24px Georgia,serif;margin:26px 0 10px}p{max-width:78ch}button,select{font:16px Arial;padding:12px;border:1px solid #78643a;background:#f5efdf;color:#263c3c;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #963f28;outline-offset:3px}.controls{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}.viewport{overflow:auto;border:1px solid #c2b698;max-width:100%;background:#f5efdf}iframe{border:0;display:block}pre{white-space:pre-wrap;font-size:13px}small{color:#655f51}#test-frame{position:absolute;left:0;top:0;visibility:hidden;pointer-events:none}details{margin-top:30px}a{color:inherit} .note{font-size:14px;color:#655f51}
</style><main><h1>The opening. The closing.</h1><p>Close review of the existing header and footer. These windows show the current journal pages, including the simplified footer.</p><div class="controls"><label>Width <select id="width"><option>1280</option><option>1024</option><option>901</option><option>900</option><option>768</option><option>390</option><option selected>360</option><option>320</option></select></label><label>Page <select id="page"><option value="index.html">Home</option><option value="editor-paresh.html">Editor</option><option value="poem-dokana.html">Poem</option><option value="archive.html">Archive</option></select></label><button id="menu">Open / close menu</button><button id="escape">Test Escape</button><button id="text">Text size: 100%</button><button id="night">Day / night (poem)</button><button id="matrix">Run responsive review</button></div><h2>Header</h2><div class="viewport"><iframe id="header" title="Actual header"></iframe></div><h2>Footer</h2><div class="viewport"><iframe id="footer" title="Actual footer"></iframe></div><p class="note" id="status" role="status"></p><details><summary>Measurements and interaction evidence</summary><pre id="metrics"></pre></details><h2>Responsive review</h2><p id="progress">Ready.</p><details><summary>All responsive measurements</summary><pre id="results"></pre></details><iframe id="test-frame" title="Responsive measurements" aria-hidden="true" tabindex="-1"></iframe></main><script>
const $=s=>document.querySelector(s);let enlarged=false;const results=[];window.reviewResults=results;
const load=(f,path)=>new Promise(resolve=>{f.onload=async()=>{await f.contentDocument.fonts.ready;resolve()};f.src='../'+path+'?header-review=28'});
function metrics(d){const w=d.defaultView,rect=e=>{let r=e.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height}},visible=e=>!!e.getClientRects().length&&w.getComputedStyle(e).display!=='none';const head=d.querySelector('.site-header'),foot=d.querySelector('.footer');return {header:rect(head),footer:rect(foot),footerCredit:rect(foot.querySelector(".footer-credit")),footerLinks:rect(foot.querySelector(".footer-links")),brand:rect(d.querySelector('.brand')),brandFont:w.getComputedStyle(d.querySelector('.brand-title')).fontSize,menuVisible:visible(d.querySelector('.menu')),menuExpanded:d.querySelector('.menu').getAttribute('aria-expanded'),navDisplay:w.getComputedStyle(d.querySelector('.nav')).display,navFont:w.getComputedStyle(d.querySelector('.nav')).fontSize,signatureFont:foot.querySelector('.signature')?w.getComputedStyle(foot.querySelector('.signature')).fontSize:null,footerCreditFont:w.getComputedStyle(foot.querySelector('.footer-credit')).fontSize,controls:[...d.querySelectorAll('header a,header button,footer a')].filter(visible).map(e=>({name:e.innerText||e.getAttribute('aria-label'),...rect(e),font:w.getComputedStyle(e).fontSize})),scrollWidth:d.documentElement.scrollWidth,viewport:w.innerWidth}}
function resize(){for(const kind of ['header','footer']){const f=$('#'+kind),d=f.contentDocument;if(!d.querySelector('.footer'))continue;let h=kind==='header'?d.querySelector('.site-header').getBoundingClientRect().height+14:d.querySelector('.footer').getBoundingClientRect().height+60;f.style.height=Math.ceil(h)+'px';f.contentWindow.scrollTo(0,kind==='footer'?d.documentElement.scrollHeight:0)}const m=metrics($('#header').contentDocument);$('#metrics').textContent=JSON.stringify(m,null,2);$('#status').textContent=`${m.viewport}px · Header ${Math.round(m.header.height)}px · Footer ${Math.round(m.footer.height)}px · Navigation ${m.navFont} · Footer note ${m.footerCreditFont}`}
function grow(d){if(!enlarged)return;const w=d.defaultView,sizes=[...d.querySelectorAll('body,body *')].filter(e=>!['SCRIPT','STYLE','SVG','PATH'].includes(e.tagName)).map(e=>[e,parseFloat(w.getComputedStyle(e).fontSize)]);sizes.forEach(([e,n])=>e.style.setProperty('font-size',2*n+'px','important'))}
async function refresh(){await Promise.all(['header','footer'].map(async id=>{let f=$('#'+id);f.style.width=$('#width').value+'px';await load(f,$('#page').value);grow(f.contentDocument)}));resize()}
$('#width').onchange=refresh;$('#page').onchange=refresh;$('#menu').onclick=()=>{$('#header').contentDocument.querySelector('.menu').click();resize()};$('#escape').onclick=()=>{const d=$('#header').contentDocument;d.dispatchEvent(new d.defaultView.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));resize();$('#status').textContent+=' · Escape returned focus to '+d.activeElement.textContent};$('#text').onclick=()=>{enlarged=!enlarged;$('#text').textContent='Text size: '+(enlarged?'200%':'100%');refresh()};$('#night').onclick=()=>{['header','footer'].forEach(id=>$('#'+id).contentDocument.querySelector('#appearance')?.click());resize()};
$('#matrix').onclick=async()=>{results.length=0;const f=$('#test-frame');for(const width of [320,390,768,900,901,1024,1280])for(const scale of [1,2]){f.style.width=width+'px';f.style.height='900px';await load(f,'index.html');const d=f.contentDocument;if(scale===2){const saved=enlarged;enlarged=true;grow(d);enlarged=saved}const before=metrics(d);d.querySelector('.menu').click();const after=metrics(d);d.dispatchEvent(new d.defaultView.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));results.push({width,scale,before,open:after,escape:{expanded:d.querySelector('.menu').getAttribute('aria-expanded'),focus:d.activeElement.className}});$('#progress').textContent=`${results.length}/14 combinations checked`;$('#results').textContent=JSON.stringify(results,null,2)}$('#progress').textContent='Complete · 14 width/text combinations';};refresh();
</script></html>
