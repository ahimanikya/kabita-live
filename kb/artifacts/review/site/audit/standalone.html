<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Standalone reader verification</title><style>body{font:16px system-ui}pre{white-space:pre-wrap}iframe{height:900px;border:1px solid #999}</style><h1>Standalone reader verification</h1><p id="status" role="status">Checking…</p><pre id="results"></pre><iframe title="Page under test"></iframe><script>
(async()=>{const out=[],f=document.querySelector('iframe');try{for(const width of [1280,360])for(const name of ['contact.html','poem-dokana.html','poet-460.html','issue-1.html','review-11.html','about.html']){f.style.width=width+'px';await new Promise(r=>{f.onload=r;f.src='../'+name;});const d=f.contentDocument,w=f.contentWindow;await d.fonts.ready;await new Promise((r,j)=>{const s=d.createElement('script');s.src='audit/axe.min.js';s.onload=r;s.onerror=j;d.head.append(s)});const a=await w.axe.run(d,{runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21aa','wcag22aa']},resultTypes:['violations']});out.push({page:name,width,overflow:d.documentElement.scrollWidth>width,brokenImages:[...d.images].filter(i=>i.complete&&!i.naturalWidth).length,violations:a.violations.map(x=>({id:x.id,nodes:x.nodes.map(n=>n.target)})),legacyLinks:[...d.links].filter(a=>a.hostname==='kabitalive.com').length,googleTags:[...d.scripts].filter(s=>s.src.includes('googletagmanager')).length});}document.querySelector('#status').textContent='Complete';}catch(e){out.push({error:String(e)});document.querySelector('#status').textContent='Failed';}document.querySelector('#results').textContent=JSON.stringify(out,null,2);})();
</script></html>
