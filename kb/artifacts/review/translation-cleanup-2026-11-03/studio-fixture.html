<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio cleanup · synthetic verification</title><link rel="stylesheet" href="../../../../projects/site/assets/editor-workspace.css"><style>body{display:block;overflow:auto;padding:1rem;max-width:60rem;margin:auto}section{margin-block:1rem}textarea,input:not([type=checkbox]){max-width:100%;box-sizing:border-box}button{margin-block:.5rem}summary{min-height:44px}#proof .verse{white-space:pre-wrap}</style><h1>Studio cleanup · synthetic verification</h1><p>Local synthetic working copy. No account, submission or publication.</p><button id="save" type="button">Save and reload working copy</button><p id="status" role="status"></p><section><h2>Poem preparation</h2><div id="poem"></div></section><section><h2>Poem proof</h2><div id="proof"></div></section><section><h2>Editorial preparation</h2><div id="editorial"></div></section><script type="module">
import {blank,newEntry,validate,checks,preparationTasks} from '../../../../projects/site/assets/editor-workspace-model.mjs';
import {editPreparation,appendPoemProof,editEditorialPreparation} from '../../../../projects/site/assets/editor-preparation-ui.mjs';
let d=blank();d.coverReference='assets/cover.webp';d.coverChecked=d.editorialChecked=true;d.poems=[{...newEntry('poem','fixture'),title:'Submitted poem',poet:'Synthetic author',authorId:'writer-1',text:'One submitted line\n\nAnother line',credits:'Submitted translator credit',translations:false,...Object.fromEntries(checks.map(k=>[k,true])),preparation:{textOnlyReason:'Text-led opening',variants:{en:{title:'Old private version',text:'Retained historical translation',credit:'Historical translator'}}}}];d.editorialText='Editorial source';d.editorialPreparation={variants:{en:{title:'English editorial',text:'English editorial text',credit:'Editor'},hi:{title:'Hindi editorial',text:'Hindi editorial text',credit:'Editor'}}};
function render(){for(const id of ['poem','proof','editorial'])document.getElementById(id).replaceChildren();editPreparation(document.getElementById('poem'),d.poems[0],{change:fn=>fn(),upload:()=>Promise.reject(Error('No uploads in fixture')),month:d.month});appendPoemProof(document.getElementById('proof'),d.poems[0]);editEditorialPreparation(document.getElementById('editorial'),d,{change:fn=>fn()});document.getElementById('status').textContent='Preparation tasks: '+preparationTasks(d).length;}
document.getElementById('save').onclick=()=>{const old=JSON.stringify(d.poems[0].preparation.variants);d=validate(JSON.parse(JSON.stringify(d)));render();document.getElementById('status').textContent=(old===JSON.stringify(d.poems[0].preparation.variants)?'Historical translation preserved. ':'ERROR: history changed. ')+'Poem translation review required: '+checks.includes('translations');};render();
</script></html>
