<!doctype html><meta charset="utf-8"><title>Link context layout checks</title><pre id="result">Running</pre><iframe title="Context option" style="height:740px"></iframe><script>
(async()=>{const f=document.querySelector('iframe'),out=document.querySelector('#result'),rows=[];for(const width of [360,1280])for(const variant of ['8','281','30']){f.style.width=width+'px';await new Promise(r=>{f.onload=r;f.src='poem-'+variant+'.html'});await new Promise(r=>setTimeout(r,200));const d=f.contentDocument;await d.fonts.ready;if(width===360)d.querySelector('#page-bookmarks-button').click();const links=[...d.querySelectorAll('#poem-secondary-links a')];rows.push({width,variant,noOverflow:d.documentElement.scrollWidth<=width,linkCount:links.length,readable:links.every(a=>a.getBoundingClientRect().height>=44&&f.contentWindow.getComputedStyle(a).textAlign==='left'),correctDestinations:links.at(-1).getAttribute('href')==='contact.html?poem='+variant&&links.every(a=>!!a.querySelector('.context-link-help'))});out.textContent=JSON.stringify(rows,null,2)}out.dataset.complete='true';out.dataset.failures=rows.filter(r=>!r.noOverflow||!r.readable||!r.correctDestinations||r.linkCount!==(r.variant==='30'?1:2)).length})();
</script>
