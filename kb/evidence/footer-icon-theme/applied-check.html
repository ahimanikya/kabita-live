<!doctype html><meta charset="utf-8"><title>Applied footer icons</title><pre id="result">Running</pre><iframe title="Footer sample" style="height:740px"></iframe><script>
(async()=>{const f=document.querySelector('iframe'),out=document.querySelector('#result'),rows=[];for(const width of [360,1280])for(const route of ['index.html','issue-1.html','poem-8.html','about.html']){f.style.width=width+'px';await new Promise(r=>{f.onload=r;f.src=route+'?footer-art=1'});await new Promise(r=>setTimeout(r,160));const d=f.contentDocument,w=f.contentWindow;await d.fonts.ready;const links=[...d.querySelectorAll('#footer .footer-links a')],icons=links.map(a=>a.querySelector('svg'));rows.push({width,route,noOverflow:d.documentElement.scrollWidth<=width,correctIcons:icons.map(i=>i.dataset.footerIcon).join(',')==='footer-story,footer-send-poem,footer-contact,footer-facebook',size24:icons.every(i=>i.getBoundingClientRect().width===24&&i.getBoundingClientRect().height===24),targets44:links.every(a=>a.getBoundingClientRect().height>=44&&a.getBoundingClientRect().width>=44),accessible:links.every(a=>!!a.getAttribute('aria-label'))&&icons.every(i=>i.getAttribute('aria-hidden')==='true'),mobileLabels:links.every(a=>(w.getComputedStyle(a.querySelector('.footer-link-label')).display==='none')===(width===360))});out.textContent=JSON.stringify(rows,null,2)}out.dataset.complete='true';out.dataset.failures=rows.filter(r=>Object.values(r).includes(false)).length})();
</script>
