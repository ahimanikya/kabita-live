<!doctype html><meta charset="utf-8"><title>Footer icon checks</title><pre id="result">Running</pre><iframe title="Footer preview" style="height:800px"></iframe><script>
(async()=>{const f=document.querySelector('iframe'),out=document.querySelector('#result'),rows=[];for(const width of [360,1280]){f.style.width=width+'px';await new Promise(r=>{f.onload=r;f.src='footer-icon-theme-review.html?check=2'});await new Promise(r=>setTimeout(r,160));const d=f.contentDocument;await d.fonts.ready;for(const mode of ['light','dark']){if(mode==='dark')d.querySelector('#theme-preview').click();const links=[...d.querySelectorAll('.footer-links a')];rows.push({width,mode,noOverflow:d.documentElement.scrollWidth<=width,allEightLinksNamed:links.length===8&&links.every(a=>!!a.getAttribute('aria-label')),targets44:links.every(a=>a.getBoundingClientRect().height>=44&&a.getBoundingClientRect().width>=44),decorativeSvg:links.every(a=>a.querySelector('svg').getAttribute('aria-hidden')==='true'),externalLabels:links.filter(a=>a.target==='_blank').every(a=>a.getAttribute('aria-label').includes('opens in a new tab')),themeApplied:mode==='dark'?d.body.classList.contains('night'):!d.body.classList.contains('night')});out.textContent=JSON.stringify(rows,null,2)}}out.dataset.complete='true';out.dataset.failures=rows.filter(r=>!r.noOverflow||!r.allEightLinksNamed||!r.targets44||!r.decorativeSvg||!r.externalLabels||!r.themeApplied).length})();
</script>
