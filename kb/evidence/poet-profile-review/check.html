<!doctype html><meta charset="utf-8"><title>Poet profile responsive audit</title><style>body{margin:12px;font:14px system-ui;background:#ddd}iframe{display:block;margin-top:12px;border:0;height:640px;background:#f6f0de}button,select{padding:8px}pre{position:absolute;left:850px;top:45px;font-size:12px;white-space:pre-wrap;width:400px}</style><select id="route"><option>poet-dokana.html</option><option>poet-kshanika.html</option><option>poet-drink.html</option><option>poet-56.html</option><option>poet-347.html</option><option>poet-233.html</option></select><select id="size"><option>360</option><option>820</option><option>1280</option></select><button onclick="openPage()">Inspect</button><button onclick="jump('main')">Opening</button><button onclick="jump('.author-reading-layout')">Biography</button><button onclick="jump('table')">Contributions</button><pre id="report"></pre><iframe id="view" title="Profile preview"></iframe><script>const view=document.getElementById('view');function openPage(){view.style.width=size.value+'px';view.src=route.value}function jump(s){view.contentDocument.querySelector(s)?.scrollIntoView({block:'start'})}view.onload=()=>{const d=view.contentDocument,w=view.contentWindow;report.textContent=JSON.stringify({route:route.value,width:w.innerWidth,scroll:d.documentElement.scrollWidth,headings:[...d.querySelectorAll('main h1,main h2')].map(e=>e.textContent),rows:d.querySelectorAll('tbody tr').length,tableDisplay:d.querySelector('table')&&w.getComputedStyle(d.querySelector('table')).display,portrait:d.querySelector('.author-profile-portrait')?.getBoundingClientRect().toJSON(),sections:[...d.querySelectorAll('main h1,main h2,main figure')].map(e=>({text:e.textContent.trim().slice(0,60),top:Math.round(e.getBoundingClientRect().top+w.scrollY),height:Math.round(e.getBoundingClientRect().height)})),brokenImages:[...d.images].filter(i=>!i.complete||!i.naturalWidth).map(i=>i.getAttribute('src'))},null,2)};const q=new URLSearchParams(location.search);if([...route.options].some(o=>o.value===q.get('page')))route.value=q.get('page');if([...size.options].some(o=>o.value===q.get('width')))size.value=q.get('width');openPage()</script>
