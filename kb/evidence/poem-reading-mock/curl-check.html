<!doctype html><html lang="en"><meta charset="utf-8"><title>Paper curl review</title><style>body{font:15px system-ui;background:#eee7d6;color:#263c3c}button,select{padding:10px;margin:4px}iframe{display:block;border:1px solid #bcb7a8;width:390px;height:740px;margin:auto}pre{white-space:pre-wrap}</style><h1>Paper curl · motion check</h1><button id="mid">Inspect forward midpoint</button><button id="back">Inspect backward midpoint</button><button id="finish">Finish turn</button><button id="rapid">Check rapid turns</button><label>Screen <select id="size"><option value="390,740">Phone</option><option value="1180,780">Tablet spread</option></select></label><pre id="result">Ready.</pre><iframe src="/poem-reading-mock.html?focus=1" title="Paper curl preview"></iframe><script>
const frame=document.querySelector('iframe'),result=document.querySelector('#result');let resume=null,savedRequest=null,savedCancel=null,frameCounter=0;
function restore(){const w=frame.contentWindow;if(savedRequest){w.requestAnimationFrame=savedRequest;w.cancelAnimationFrame=savedCancel;savedRequest=null;savedCancel=null;}if(resume){const fn=resume;resume=null;fn(w.performance.now()+600)}}
function show(direction){restore();const w=frame.contentWindow,d=frame.contentDocument;const s=d.querySelector('#focus-poem');s.value='6';s.dispatchEvent(new Event('change'));const lang=d.querySelector('#focus-language');lang.value='en';lang.dispatchEvent(new Event('change'));const sz=d.querySelector('#focus-size');sz.value='30';sz.dispatchEvent(new Event('change'));if(!d.querySelector('#focus-motion').checked)d.querySelector('#focus-motion').click();if(direction<0)d.querySelector('#focus-next').click();
 savedRequest=w.requestAnimationFrame;savedCancel=w.cancelAnimationFrame;
 w.requestAnimationFrame=fn=>{resume=fn;return ++frameCounter};w.cancelAnimationFrame=()=>{resume=null};
 d.querySelector(direction>0?'#focus-next':'#focus-prev').click();const cb=resume;resume=null;if(cb)cb(w.performance.now()+260);
 const layer=d.querySelector('.paper-turn-layer'),area=d.querySelector('#focus-pages');result.textContent=JSON.stringify({direction,overlay:!!layer,ariaHidden:layer?.getAttribute('aria-hidden'),inert:layer?.inert,snapshotUnits:layer?.querySelectorAll('[data-unit]').length,clip:layer?.querySelector('.turn-snapshot').style.clipPath,visibleVerseUnits:area.querySelectorAll('[data-unit]').length,progress:d.querySelector('#focus-progress').textContent},null,2);
}
document.querySelector('#mid').onclick=()=>show(1);document.querySelector('#back').onclick=()=>show(-1);document.querySelector('#finish').onclick=()=>{restore();result.textContent='Turn finished; temporary sheet removed: '+!frame.contentDocument.querySelector('.paper-turn-layer')};
document.querySelector('#size').onchange=e=>{restore();const [width,height]=e.target.value.split(',');frame.style.width=width+'px';frame.style.height=height+'px'};
document.querySelector('#rapid').onclick=async()=>{restore();const d=frame.contentDocument;for(let i=0;i<8;i++){d.querySelector('#focus-next').click();d.querySelector('#focus-prev').click()}await new Promise(r=>setTimeout(r,650));const noLayer=!d.querySelector('.paper-turn-layer');const motion=d.querySelector('#focus-motion');motion.click();d.querySelector('#focus-next').click();const disabled=!d.querySelector('.paper-turn-layer');motion.click();d.querySelector('#focus-next').click();d.querySelector('#close-focus').click();const exit=!d.querySelector('.paper-turn-layer');result.textContent=JSON.stringify({rapidTurnsCleaned:noLayer,motionOffNoOverlay:disabled,exitCleansOverlay:exit},null,2)};
</script></html>
