<!doctype html><html lang="en"><meta charset="utf-8"><title>Edition review checks</title><style>body{font:14px system-ui;padding:12px;background:#eee;color:#222}button{padding:8px;margin:3px}iframe{flex:none;width:360px;height:800px;border:1px solid #888;display:block}pre{white-space:pre-wrap;max-width:600px}.layout{display:flex;gap:24px;align-items:start}</style><nav><button data-width="320">320px</button><button data-width="360">360px</button><button data-width="390">390px</button><button data-width="1280">Desktop</button><button data-page="issue-47.html">Issue 47</button><button data-page="issue-1.html">Issue 1</button><button data-page="issue-27.html">Issue 27</button><button data-page="issue-3.html">Issue 3</button><button data-section="Within these pages.">Contents</button><button id="footer">Footer</button></nav><div class="layout"><iframe title="Live site checks" src="/issue-47.html"></iframe><pre id="results"></pre></div><script>
const frame=document.querySelector('iframe'),results=document.querySelector('#results');
function report(){const d=frame.contentDocument,w=frame.contentWindow; if(!d.querySelector('.masthead'))return;const box=e=>{const r=e.getBoundingClientRect();return {x:Math.round(r.x),width:Math.round(r.width),height:Math.round(r.height)}};results.textContent=JSON.stringify({portraitWidths:[...d.querySelectorAll('.edition-poet-portrait')].map(e=>Math.round(e.getBoundingClientRect().width)),mobileLabels:[...d.querySelectorAll('.mobile-original-label')].map(e=>w.getComputedStyle(e).display),width:w.innerWidth,overflow:d.documentElement.scrollWidth>w.innerWidth,header:box(d.querySelector('.masthead')),theme:{...box(d.querySelector('[data-theme-toggle]')),parent:d.querySelector('[data-theme-toggle]').parentElement.className,state:d.querySelector('[data-theme-toggle]').getAttribute('aria-label')},menuOpen:d.querySelector('#mobile-navigation')?.open,drawerFonts:[...d.querySelectorAll('#mobile-navigation a')].map(e=>w.getComputedStyle(e).fontSize),poemCardHeights:[...d.querySelectorAll('.card-identity')].map(e=>Math.round(e.getBoundingClientRect().height)),contentsStart:Math.round(d.querySelector('.edition-contents').getBoundingClientRect().top+w.scrollY),visiblePoems:[...d.querySelectorAll('.edition-poem-row')].filter(e=>!e.hidden).length,languageFilters:[...d.querySelectorAll('[data-language]')].map(e=>e.textContent),footerAlignment:w.getComputedStyle(d.querySelector('.footer-credit')).textAlign},null,2)}
frame.addEventListener('load',()=>{frame.contentDocument.fonts.ready.then(report);frame.contentWindow.addEventListener('resize',report);new MutationObserver(report).observe(frame.contentDocument.body,{childList:true,attributes:true,subtree:true,attributeFilter:['data-theme','open','class','aria-expanded']});});document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>frame.style.width=b.dataset.width+'px');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>frame.src='/'+b.dataset.page);document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>[...frame.contentDocument.querySelectorAll('h2')].find(h=>h.textContent===b.dataset.section)?.scrollIntoView({block:'start'}));document.querySelector('#footer').onclick=()=>frame.contentDocument.querySelector('#footer').scrollIntoView({block:'end'});
</script></html>
