<!doctype html><meta charset="utf-8"><title>Quiet tools dismissal checks</title><h1>Quiet tools dismissal</h1><pre id="result">Running</pre><iframe id="sample" title="Reader sample" style="height:740px"></iframe><script>
(async()=>{const frame=document.querySelector('iframe'),out=document.querySelector('#result'),rows=[];const wait=ms=>new Promise(r=>setTimeout(r,ms));function check(name,pass){rows.push({name,pass:!!pass});out.textContent=JSON.stringify(rows,null,2)}
for(const width of [360,1280])for(const route of ['poem-8.html','poem-space-8.html']){
frame.style.width=width+'px';await new Promise(r=>{frame.onload=r;frame.src=route+'?dismiss-check=2'});await wait(300);const d=frame.contentDocument,w=frame.contentWindow;await d.fonts.ready;
const dialog=d.querySelector('#focus-reader'),panel=d.querySelector('#focus-settings'),toggle=d.querySelector('#focus-settings-button'),area=d.querySelector('#focus-pages');d.querySelector('#open-focus').click();for(let i=0;i<40&&!dialog.open;i++)await wait(100);const name=width+' '+route;
check(name+' quiet opens',dialog.open);toggle.click();check(name+' tools open',!panel.hidden&&toggle.getAttribute('aria-expanded')==='true');
d.querySelector('#focus-language').dispatchEvent(new w.PointerEvent('pointerdown',{bubbles:true,pointerType:'touch'}));check(name+' interaction inside keeps tools open',!panel.hidden);
area.dispatchEvent(new w.PointerEvent('pointerdown',{bubbles:true,pointerType:'touch'}));check(name+' outside tap closes tools only',panel.hidden&&dialog.open&&toggle.getAttribute('aria-expanded')==='false');check(name+' focus not left hidden',!panel.contains(d.activeElement));
toggle.click();area.dispatchEvent(new w.PointerEvent('pointerdown',{bubbles:true,pointerType:'mouse'}));check(name+' outside mouse closes tools only',panel.hidden&&dialog.open);
toggle.click();const cancel=new w.Event('cancel',{cancelable:true});dialog.dispatchEvent(cancel);check(name+' Escape closes tools only',cancel.defaultPrevented&&panel.hidden&&dialog.open);check(name+' Escape returns focus to Aa',d.activeElement===toggle);
const second=new w.Event('cancel',{cancelable:true});dialog.dispatchEvent(second);check(name+' next Escape may exit reader',!second.defaultPrevented);d.querySelector('#close-focus').click();await wait(50);
}
out.dataset.complete='true';out.dataset.failures=rows.filter(x=>!x.pass).length;
})().catch(e=>{document.querySelector('#result').textContent=e.stack;document.querySelector('#result').dataset.complete='error'});
</script>
