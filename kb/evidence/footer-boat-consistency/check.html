<!doctype html><meta charset="utf-8"><title>Footer boat consistency</title><h1>Footer boat consistency</h1><pre id="result">Running…</pre><iframe title="Footer sample" style="height:740px"></iframe><script>
(async()=>{const f=document.querySelector('iframe'),out=document.querySelector('#result'),rows=[];const wait=ms=>new Promise(r=>setTimeout(r,ms));for(const width of [360,1280]){let reference;for(const route of ['index.html','archive.html','issue-1.html','poet-21.html','poem-8.html','poem-space-8.html']){f.style.width=width+'px';await new Promise(r=>{f.onload=r;f.src=route+'?boat-check=2'});await wait(120);const d=f.contentDocument,w=f.contentWindow,boat=d.querySelector('#footer .earth-edge'),line=d.querySelector('#footer .footer-line'),s=w.getComputedStyle(boat),dimensions={width:s.width,height:s.height,backgroundSize:s.backgroundSize};reference??=dimensions;rows.push({width,route,dimensions,sameSize:JSON.stringify(reference)===JSON.stringify(dimensions),clearOfLinks:boat.getBoundingClientRect().bottom<=line.getBoundingClientRect().top,noOverflow:d.documentElement.scrollWidth<=width});out.textContent=JSON.stringify(rows,null,2)}}out.dataset.complete='true';out.dataset.failures=rows.filter(r=>!r.sameSize||!r.clearOfLinks||!r.noOverflow).length})().catch(e=>document.querySelector('#result').textContent=e.stack);
