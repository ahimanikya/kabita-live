<!doctype html><html lang="en"><meta charset="utf-8"><title>Poem review checks</title><style>body{font:14px system-ui;padding:12px;background:#eee;color:#222}button{padding:8px;margin:3px}iframe{flex:none;width:360px;height:780px;border:1px solid #888;display:block}pre{white-space:pre-wrap;max-width:550px}.layout{display:flex;gap:24px;align-items:start}</style><nav><button data-width="320">320px</button><button data-width="360">360px</button><button data-width="390">390px</button><button data-width="1280">Desktop</button><button data-page="poem-8.html">Odia</button><button data-page="poem-kshanika.html">Hindi</button><button data-page="poem-drink.html">English</button><button data-page="poem-385.html">Incomplete source</button><button data-size="24">A</button><button data-size="32">A++</button><button data-lang="or">Read Odia</button><button data-lang="hi">Read Hindi</button><button data-lang="en">Read English</button><button data-scroll=".reading-layout">Verse</button><button data-scroll=".poem-reading-end">End</button><button data-scroll=".poem-opening">Opening</button></nav><div class="layout"><iframe title="Poem under review" src="/poem-8.html"></iframe><pre id="results"></pre></div><script>
const frame=document.querySelector('iframe'),results=document.querySelector('#results');
function report(){const d=frame.contentDocument,w=frame.contentWindow;if(!d.querySelector('.verse'))return;const box=e=>{const r=e.getBoundingClientRect();return {x:Math.round(r.x),top:Math.round(r.y+w.scrollY),width:Math.round(r.width),height:Math.round(r.height)}};results.textContent=JSON.stringify({page:w.location.pathname,width:w.innerWidth,overflow:d.documentElement.scrollWidth>w.innerWidth,title:box(d.querySelector('h1')),art:box(d.querySelector('.poem-art')),verse:box(d.querySelector('.verse')),verseFont:w.getComputedStyle(d.querySelector('.verse')).fontSize,verseLang:d.querySelector('.verse').lang,tabs:[...d.querySelectorAll('[role=tab]')].map(e=>({text:e.textContent,...box(e),selected:e.getAttribute('aria-selected')})),sizes:[...d.querySelectorAll('[data-size]')].map(e=>({...box(e),label:e.textContent,pressed:e.getAttribute('aria-pressed')})),stanzas:d.querySelectorAll('.stanza').length,sourceNotice:d.querySelector('.source-availability')?.textContent,prevDisabled:d.querySelector('.previous')?.disabled,nextDisabled:d.querySelector('.next')?.disabled},null,2)}
frame.addEventListener('load',()=>{frame.contentDocument.fonts.ready.then(report);frame.contentWindow.addEventListener('resize',report);new MutationObserver(report).observe(frame.contentDocument.body,{childList:true,attributes:true,subtree:true,attributeFilter:['class','aria-selected','aria-pressed','lang','style']});});document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>frame.style.width=b.dataset.width+'px');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>frame.src='/'+b.dataset.page);document.querySelectorAll('[data-scroll]').forEach(b=>b.onclick=()=>frame.contentDocument.querySelector(b.dataset.scroll)?.scrollIntoView({block:'start'}));document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>frame.contentDocument.querySelector('[data-size="'+b.dataset.size+'"]').click());document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>frame.contentDocument.querySelector('[data-reading-language="'+b.dataset.lang+'"]')?.click());
</script></html>
