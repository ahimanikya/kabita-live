<!doctype html><html lang="en"><meta charset="utf-8"><title>Applied mobile refinement checks</title><style>body{font:14px system-ui;padding:12px;background:#eee;color:#222}button{padding:8px;margin:3px}iframe{flex:none;width:360px;height:800px;border:1px solid #888;display:block}pre{white-space:pre-wrap;max-width:600px}.layout{display:flex;gap:24px;align-items:start}</style><nav><button data-width="320">320px</button><button data-width="360">360px</button><button data-width="390">390px</button><button data-width="1280">Desktop</button><button data-page="index.html">Home</button><button data-page="poem-8.html">Poem</button><button id="footer">Footer</button></nav><div class="layout"><iframe title="Live site checks" src="/index.html"></iframe><pre id="results"></pre></div><script>
const frame=document.querySelector('iframe'),results=document.querySelector('#results');
function report(){const d=frame.contentDocument,w=frame.contentWindow; if(!d.querySelector('.masthead'))return;const box=e=>{const r=e.getBoundingClientRect();return {x:Math.round(r.x),width:Math.round(r.width),height:Math.round(r.height)}};results.textContent=JSON.stringify({width:w.innerWidth,overflow:d.documentElement.scrollWidth>w.innerWidth,header:box(d.querySelector('.masthead')),theme:{...box(d.querySelector('[data-theme-toggle]')),parent:d.querySelector('[data-theme-toggle]').parentElement.className,state:d.querySelector('[data-theme-toggle]').getAttribute('aria-label')},menuOpen:d.querySelector('#mobile-navigation')?.open,drawerFonts:[...d.querySelectorAll('#mobile-navigation a')].map(e=>w.getComputedStyle(e).fontSize),poemCardHeights:[...d.querySelectorAll('.card-identity')].map(e=>Math.round(e.getBoundingClientRect().height)),footerAlignment:w.getComputedStyle(d.querySelector('.footer-credit')).textAlign},null,2)}
frame.addEventListener('load',()=>{frame.contentDocument.fonts.ready.then(report);frame.contentWindow.addEventListener('resize',report);new MutationObserver(report).observe(frame.contentDocument.body,{childList:true,attributes:true,subtree:true,attributeFilter:['data-theme','open','class','aria-expanded']});});document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>frame.style.width=b.dataset.width+'px');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>frame.src='/'+b.dataset.page);document.querySelector('#footer').onclick=()=>frame.contentDocument.querySelector('#footer').scrollIntoView({block:'end'});
</script></html>
