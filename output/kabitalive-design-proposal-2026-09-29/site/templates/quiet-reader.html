<dialog id="focus-reader" aria-label="Quiet poetry reader">
 <div class="focus-shell">
  <header class="focus-top"><button id="close-focus" aria-label="Exit reading mode">← <span>Exit reading</span></button><div class="focus-top-tools"><div class="focus-language-icons" role="group" aria-label="Reader language"><button type="button" data-focus-language="or" lang="or" aria-label="Read in Odia" title="ଓଡ଼ିଆ" aria-pressed="false">ଅ<span class="focus-language-tip" aria-hidden="true">ଓଡ଼ିଆ</span></button><button type="button" data-focus-language="hi" lang="hi" aria-label="Read in Hindi" title="हिन्दी" aria-pressed="false">अ<span class="focus-language-tip" aria-hidden="true">हिन्दी</span></button><button type="button" data-focus-language="en" lang="en" aria-label="Read in English" title="English" aria-pressed="false">A<span class="focus-language-tip" aria-hidden="true">English</span></button></div><button id="focus-bookmark" aria-label="Bookmark this page" aria-pressed="false" title="Bookmark this page"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M6 3.5h12v17l-6-4-6 4z"/></svg></button><button type="button" id="focus-theme-toggle" class="appearance-toggle" data-theme-toggle aria-label="Theme: System. Switch to Light." title="Theme: System. Switch to Light." data-theme="system" hidden><svg class="theme-system" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="1.5"/><path d="M9 21h6m-3-4v4"/></svg><svg class="theme-moon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20.3 14.4A8.7 8.7 0 0 1 9.6 3.7 8.7 8.7 0 1 0 20.3 14.4Z"/></svg><svg class="theme-sun" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4L19 5"/></svg><span class="appearance-label">Theme: System</span></button><button id="focus-settings-button" aria-expanded="false" aria-controls="focus-settings" aria-label="Reading settings" title="Reading settings"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 6H20M4 12H20M4 18H16"/></svg></button></div></header>
  <section id="focus-settings" hidden aria-label="Reading settings">
   <button type="button" class="focus-original-language" data-focus-language="original" aria-pressed="true">Use each poem’s original language</button>
   <details id="focus-library"><summary>Choose an edition or poet</summary>
    <label>Browse by <select id="focus-browse-kind"><option value="editions">Edition</option><option value="poets">Poet</option></select></label>
    <label>Find an edition or poet <input id="focus-collection-search" type="search" placeholder="A name, month or year"></label>
    <label>Collection <select id="focus-collection"></select></label>
    <label>Find a poem <input id="focus-poem-search" type="search" placeholder="A title or remembered line"></label>
    <label>Matching poems <select id="focus-results"></select></label>
    <p id="focus-library-status" role="status"></p>
    <div class="focus-library-actions"><button id="focus-read-one" type="button" disabled>Read poem</button><button id="focus-read-all" type="button" disabled>Read all</button></div>
   </details>
   <label>In your reading list <select id="focus-poem"></select></label>

   <label class="focus-switch"><span>Show illustrations</span><input type="checkbox" id="focus-illustrations"></label>
   <label class="focus-switch"><span>Paper turn</span><input type="checkbox" id="focus-motion"></label>
   <label class="focus-switch"><span>Soft page sound</span><input type="checkbox" id="focus-sound"></label>
   <button id="focus-sound-test" type="button" hidden>Try the sound</button>
   <p id="focus-load-note" role="status" hidden></p><p id="focus-effects-note" role="status"></p>
   <details id="focus-saved"><summary>Saved places &amp; passages</summary><div id="focus-saved-list"></div></details>
   <p>Select a word or phrase to underline it. On a phone, hold a word and adjust the handles.</p>
   <p>Your place, bookmarks and underlines stay on this device.</p>
  </section>
  <main id="focus-pages" tabindex="0" aria-label="Poem pages"></main>
  <div id="focus-selection-tools" role="toolbar" aria-label="Selected passage" hidden><button id="focus-mark">Underline</button><button id="focus-erase">Remove underline</button><button id="focus-selection-close" aria-label="Dismiss passage tools">×</button></div>
  <footer class="focus-bottom"><button id="focus-prev" aria-label="Previous page">←</button><span id="focus-progress" role="status" aria-live="polite"></span><button id="focus-next" aria-label="Next page">→</button></footer>
  <span class="sr-only" id="focus-announcement" role="status"></span>
 </div>
</dialog>
