<section class="poem-engagement" data-poem-engagement="{{POEM_ID}}" aria-label="Reader responses" data-pagefind-ignore hidden>
 <div class="like-row"><button type="button" data-like aria-pressed="false" aria-label="Like this poem"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 20.5 3.8 12.4C-1.6 6.8 6.4 0 12 6.8 17.6 0 25.6 6.8 20.2 12.4Z"/></svg><span data-like-label>Like</span><span data-like-count aria-hidden="true">—</span></button><span data-like-status role="status"></span></div>
 <details><summary>Comments</summary>
  <p class="small muted">A few words about what stayed with you. Comments appear after editorial review.</p>
  <div data-comments-list role="region" aria-label="Published comments" aria-live="polite">Open comments to read the conversation.</div>
  <button type="button" class="text-link" data-comments-more hidden>Load more comments</button>
  <form class="form-stack" data-public-comment>
   <label><span class="label">Your public name</span><input name="name" required maxlength="80" autocomplete="nickname"></label>
   <label><span class="label">Your comment</span><textarea name="message" required maxlength="2000" placeholder="What did this poem bring to mind?"></textarea></label>
   <label class="comment-consent"><input type="checkbox" required name="consent"><span>I agree that my name and comment may be published after editorial review. I have not included private contact details.</span></label>
   <p class="small muted">For corrections or a private message, <a href="contact.html?poem={{POEM_ID}}">write to the editor</a>. Likes and submissions use an anonymous browser identifier; clearing browser data can reset it.</p>
   <button class="btn" type="submit">Submit comment for review</button><p class="status" role="status"></p>
  </form>
 </details>
</section>
